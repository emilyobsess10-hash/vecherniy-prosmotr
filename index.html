
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#253b36">
<title>Вечерний просмотр</title>
<style>
:root{--g:#253b36;--g2:#354d45;--bg:#f7f4f0;--ink:#292f2b;--muted:#827d73;--line:#e8e1d7}
*{box-sizing:border-box}
body{margin:0;background:#eee9e1;color:var(--ink);font:15px system-ui,-apple-system,sans-serif}
header{background:var(--g);color:#fff9ef;padding:26px 20px}
header small{color:#d8c8a9;letter-spacing:1.5px}
h1{font:36px Georgia,serif;font-weight:500;margin:9px 0}
header p{color:#e2e5d9;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.stat{background:var(--g2);padding:12px;border-radius:12px}
.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#d8e0d9}
main{max-width:760px;margin:auto;padding:16px}
input,select{font:inherit;min-width:0;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:10px;padding:10px;border:1px solid #dcd5c9;background:white;color:var(--g2);font-weight:650}
.primary{background:var(--g2);color:white;border-color:var(--g2)}
.top{display:flex;gap:8px;margin-bottom:12px}.top input{flex:1}
.filters{display:flex;gap:6px;overflow-x:auto;padding:3px 0 14px}
.chip{white-space:nowrap;border:0;border-radius:30px;background:#eae5dd;font-size:12px}
.chip.active{background:var(--g2);color:white}
.heading{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
h2{font:22px Georgia,serif;margin:0}.muted{color:var(--muted);font-size:12px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:11px;align-items:flex-start}
.poster{background:#f0e9dd;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.name{font-weight:750;line-height:1.35;flex:1;overflow-wrap:anywhere}
.type{color:var(--muted);font-size:12px;margin-top:4px}
.delete{border:0;padding:0 4px;color:#aaa;background:transparent;font-size:20px}
.progress{background:#f5f2ec;padding:12px;border-radius:11px;margin:14px 0}
.progress small{color:var(--muted);font-size:10px;letter-spacing:1px}
.progress strong{display:block;font:24px Georgia,serif;color:var(--g2);margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .finish{grid-column:1/-1;background:var(--g2);color:white}
.form{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.form h3{font:22px Georgia,serif;margin:0 0 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.hidden{display:none!important}
details{margin-top:18px}summary{cursor:pointer;background:#eae5dd;border-radius:12px;padding:15px;font-weight:700;display:flex;justify-content:space-between}
.archiveitem{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;display:flex;gap:9px;align-items:center}
.archiveitem .info{flex:1;min-width:0}.archiveitem small{display:block;color:var(--muted);margin-top:4px}
.empty{text-align:center;padding:24px;color:var(--muted)}
.foot{text-align:center;padding:22px;color:var(--g2)}.foot small{display:block;color:var(--muted);margin-top:7px}
</style>
</head>
<body>
<header>
 <small>МОЯ ЛИЧНАЯ КОЛЛЕКЦИЯ</small>
 <h1>Вечерний просмотр ✨</h1>
 <p>Все истории, которые ещё ждут тебя</p>
 <div class="stats">
  <div class="stat"><b id="activeN">10</b><span>Смотрю</span></div>
  <div class="stat"><b id="doneN">0</b><span>Досмотрено</span></div>
  <div class="stat"><b id="episodeN">0</b><span>Серии в текущих сезонах</span></div>
 </div>
</header>
<main>
 <div class="top">
  <input id="search" placeholder="🔎 Найти сериал..." aria-label="Поиск">
  <button class="primary" id="toggle">＋ Добавить</button>
 </div>
 <section id="formbox" class="form hidden">
  <h3>Новая история</h3>
  <form id="addform">
   <input id="title" placeholder="Название сериала" required maxlength="120">
   <div class="formgrid">
    <select id="type" aria-label="Тип">
     <option>Сериал</option><option>Турецкий сериал</option><option>Русский сериал</option><option>Дорама</option><option>Мультсериал</option>
    </select>
    <input id="season" type="number" min="1" value="1" aria-label="Сезон" required>
    <input id="episode" type="number" min="1" value="1" aria-label="Серия" required>
   </div>
   <button class="primary" type="submit">Добавить</button>
   <button type="button" id="cancel">Отмена</button>
  </form>
 </section>
 <nav class="filters" id="filters">
  <button class="chip active" data-filter="Все">Все</button>
  <button class="chip" data-filter="Сериал">Сериалы</button>
  <button class="chip" data-filter="Турецкий сериал">Турецкие</button>
  <button class="chip" data-filter="Русский сериал">Русские</button>
  <button class="chip" data-filter="Дорама">Дорамы</button>
  <button class="chip" data-filter="Мультсериал">Мульты</button>
 </nav>
 <div class="heading"><h2>Продолжаю смотреть</h2><span class="muted" id="count">10 шт.</span></div>
 <div id="cards"></div>
 <details>
  <summary><span>📚 Просмотренные</span><span id="archiveN">0</span></summary>
  <div id="archive"></div>
 </details>
 <button id="backup" style="width:100%;margin-top:16px">Скачать резервную копию</button>
 <label style="display:block;text-align:center;margin-top:8px;cursor:pointer"><button type="button" style="width:100%">Восстановить копию</button><input id="restore" type="file" accept=".json,application/json" hidden></label>
</main>
<footer class="foot">☕ Чай, плед и ещё одна серия.
 <small>Прогресс сохраняется в этом браузере. Резервная копия поможет перенести список.</small>
</footer>
<script>
const KEY='evening-watch-v1';
const initial=[
[1,'Однажды в сказке','Сериал',7,5],
[2,'Стамбульская невеста','Турецкий сериал',1,7],
[3,'Жестокий Стамбул','Турецкий сериал',1,96],
[4,'Первая любовь','Турецкий сериал',1,6],
[5,'В ожидании солнца','Турецкий сериал',1,1],
[6,'Бесы','Русский сериал',1,3],
[7,'А у нас во дворе','Русский сериал',1,6],
[8,'Этот парень — чёрный огненный дракон','Дорама',1,10],
[9,'Пособие для резидентов','Дорама',1,3],
[10,'Гравити Фолз','Мультсериал',2,19]
].map(([id,title,type,season,episode])=>({id,title,type,season,episode}));
function load(){
 try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.active)&&Array.isArray(s.done))return s}catch(e){}
 return {active:initial,done:[],next:11};
}
let state=load(),filter='Все',query='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Не удалось сохранить. Скачай резервную копию.')} }
function render(){
 $('activeN').textContent=state.active.length;
 $('doneN').textContent=state.done.length;
 $('episodeN').textContent=state.active.reduce((n,s)=>n+s.episode,0);
 $('archiveN').textContent=state.done.length;
 let list=state.active.filter(s=>(filter==='Все'||s.type===filter)&&s.title.toLocaleLowerCase('ru').includes(query.toLocaleLowerCase('ru')));
 $('count').textContent=list.length+' шт.';
 $('cards').innerHTML=list.length?list.map(s=>`<article class="card">
  <div class="row"><div class="poster">${s.type==='Мультсериал'?'🎨':'📺'}</div><div style="flex:1;min-width:0"><div class="name">${esc(s.title)}</div><div class="type">${esc(s.type)}</div></div><button class="delete" data-a="delete" data-id="${s.id}" aria-label="Удалить">×</button></div>
  <div class="progress"><small>ОСТАНОВИЛАСЬ НА</small><strong>Сезон ${s.season}, серия ${s.episode}</strong></div>
  <div class="actions"><button data-a="episode" data-id="${s.id}">＋ 1 серия</button><button data-a="season" data-id="${s.id}">⏭ След. сезон</button><button class="finish" data-a="finish" data-id="${s.id}">✓ Досмотрела</button></div>
 </article>`).join(''):'<div class="empty">🍿<br>Ничего не нашлось</div>';
 $('archive').innerHTML=state.done.length?state.done.map(s=>`<div class="archiveitem"><span>✓</span><div class="info"><b>${esc(s.title)}</b><small>${esc(s.type)} · Досмотрено</small></div><button data-a="restore" data-id="${s.id}">Вернуть</button><button class="delete" data-a="deleteDone" data-id="${s.id}">×</button></div>`).join(''):'<div class="empty">🤍<br>Здесь пока пусто. Первые победы ещё впереди!</div>';
}
$('cards').addEventListener('click',e=>{
 let b=e.target.closest('[data-a]');if(!b)return;
 let id=+b.dataset.id,s=state.active.find(x=>x.id===id);if(!s)return;
 if(b.dataset.a==='episode')s.episode++;
 if(b.dataset.a==='season'){s.season++;s.episode=1}
 if(b.dataset.a==='finish'){state.active=state.active.filter(x=>x.id!==id);state.done.unshift({...s})}
 if(b.dataset.a==='delete'){if(!confirm(`Удалить «${s.title}» из списка?`))return;state.active=state.active.filter(x=>x.id!==id)}
 save();render();
});
$('archive').addEventListener('click',e=>{
 let b=e.target.closest('[data-a]');if(!b)return;let id=+b.dataset.id;
 if(b.dataset.a==='restore'){let s=state.done.find(x=>x.id===id);if(s){state.done=state.done.filter(x=>x.id!==id);state.active.push(s)}}
 if(b.dataset.a==='deleteDone'){if(!confirm('Удалить запись?'))return;state.done=state.done.filter(x=>x.id!==id)}
 save();render();
});
$('filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
$('search').addEventListener('input',e=>{query=e.target.value;render()});
$('toggle').onclick=()=>$('formbox').classList.toggle('hidden');
$('cancel').onclick=()=>$('formbox').classList.add('hidden');
$('addform').addEventListener('submit',e=>{
 e.preventDefault();state.active.push({id:state.next++,title:$('title').value.trim(),type:$('type').value,season:Math.max(1,+$('season').value||1),episode:Math.max(1,+$('episode').value||1)});
 save();render();e.target.reset();$('season').value=1;$('episode').value=1;$('formbox').classList.add('hidden');
});
$('backup').onclick=()=>{
 let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='vecherniy-prosmotr-backup.json';a.click();URL.revokeObjectURL(url);
};
$('restore').addEventListener('change',async e=>{
 let f=e.target.files[0];if(!f)return;
 try{let d=JSON.parse(await f.text());if(!Array.isArray(d.active)||!Array.isArray(d.done))throw 0;
 if(!confirm('Заменить текущий список копией?'))return;
 state={active:d.active,done:d.done,next:d.next||Math.max(10,...d.active.map(x=>x.id),...d.done.map(x=>x.id))+1};save();render();alert('Копия восстановлена!');
 }catch(err){alert('Не получилось прочитать файл резервной копии.')}finally{e.target.value=''}
});
render();
</script>
</body>
</html>
